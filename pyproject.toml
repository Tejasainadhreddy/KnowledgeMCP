[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgemcp"
version = "0.1.0"
description = "RAG knowledge base on AWS (Bedrock + Aurora pgvector) served as an MCP server and a REST API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Teja Sai Nadh Reddy Tatireddy" }]
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "mangum>=0.19",
    "pydantic>=2.7",
    "pypdf>=5.0",
    "aws-lambda-powertools[tracer]>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
local = ["psycopg[binary]>=3.2", "uvicorn>=0.30"]
mcp = ["mcp>=2.0"]
dev = [
    "pytest>=8",
    "moto[s3]>=5.0",
    "reportlab>=4.0",
    "ruff>=0.6",
    "psycopg[binary]>=3.2",
    "mcp>=2.0",
]

[project.scripts]
knowledgemcp-mcp = "knowledgemcp.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["integration: needs a real Postgres with pgvector (set DATABASE_URL)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the standard pattern
