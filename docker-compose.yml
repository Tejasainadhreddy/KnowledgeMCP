# Local development: Postgres + pgvector and the API, no AWS needed.
#   docker compose up --build
#   open http://localhost:8000/docs
# Offline models are the default. To use real Bedrock models locally, set EMBEDDER/LLM/RERANKER=bedrock
# in .env and uncomment the ~/.aws volume below.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kmcp
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kmcp"]
      interval: 2s
      retries: 20

  api:
    build: .
    entrypoint: ["sh", "-c"]
    command: ["python -m knowledgemcp.cli ingest /data && uvicorn knowledgemcp.api:app --host 0.0.0.0 --port 8000"]
    working_dir: /var/task
    environment:
      DB_MODE: psycopg
      DATABASE_URL: postgresql://postgres:postgres@db:5432/kmcp
      EMBEDDER: ${EMBEDDER:-hash}
      LLM: ${LLM:-fake}
      RERANKER: ${RERANKER:-lexical}
      AWS_REGION: ${AWS_REGION:-us-west-2}
      API_KEYS_JSON: ${API_KEYS_JSON:-{}}
      POWERTOOLS_TRACE_DISABLED: "1"
    volumes:
      - ./sample_docs:/data:ro
      # - ~/.aws:/root/.aws:ro
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
